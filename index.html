<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FE万紫千紅 データベース</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>ファイアーエムブレム 万紫千紅 データベース</h1>
        <nav>
            <ul>
                <li><a href="index.html" class="active">ホーム</a></li>
                <li><a href="characters/">キャラクター</a></li>
                <li><a href="classes/">クラス</a></li>
                <li><a href="skills/">スキル</a></li>
                <li><a href="items/">アイテム</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="dashboard">
            <div class="dashboard-grid">
                <a href="characters/" class="dashboard-card">
                    <div class="dashboard-icon">👤</div>
                    <h2>キャラクター</h2>
                    <p>64名。成長率・ルート別の加入条件（支援Lv／名声Lv）の早見表</p>
                </a>
                <a href="classes/" class="dashboard-card">
                    <div class="dashboard-icon">⚔️</div>
                    <h2>クラス</h2>
                    <p>60兵種。階級・成長ボーナス・移動力・使用可能技能・解放条件</p>
                </a>
                <a href="skills/" class="dashboard-card">
                    <div class="dashboard-icon">✨</div>
                    <h2>スキル</h2>
                    <p>個人スキル・血印・ルーツ・ブレイズアーツ／スキル／タイプ・兵種＆マスタースキル</p>
                </a>
                <a href="items/" class="dashboard-card">
                    <div class="dashboard-icon">📦</div>
                    <h2>アイテム</h2>
                    <p>消費アイテム・指南書など（手入力データ）</p>
                </a>
            </div>
        </section>
    </main>
    <footer>
        <p>FE万紫千紅 個人用データベース</p>
    </footer>
</body>
</html>
