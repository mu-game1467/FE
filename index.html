<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FE万紫千紅 データベース</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>ファイアーエムブレム 万紫千紅 データベース</h1>
        <nav>
            <ul>
                <li><a href="#characters">キャラクター</a></li>
                <li><a href="#classes">クラス</a></li>
                <li><a href="#items">アイテム</a></li>
                <li><a href="#skills">スキル</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="characters">
            <h2>キャラクター</h2>
            <div id="character-list" class="data-grid"></div>
        </section>
        <section id="classes">
            <h2>クラス</h2>
            <div id="class-list" class="data-grid"></div>
        </section>
        <section id="items">
            <h2>アイテム</h2>
            <div id="item-list" class="data-grid"></div>
        </section>
        <section id="skills">
            <h2>スキル</h2>
            <div id="skill-list" class="data-grid"></div>
        </section>
    </main>
    <footer>
        <p>FE万紫千紅 個人用データベース</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
